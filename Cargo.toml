[package]
name = "weigh-calc"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
rig = "0.38.1"
tokio = { version = "1.28.2", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures = "0.3"
rustyline = "18.0.0"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
